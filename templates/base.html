{# Layout base. Todo valor dinamico entra via {{ ... }} e passa pelo autoescape do Jinja2.
   O filtro "safe" e proibido neste projeto (ha uma regra do Semgrep para isso). #}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskFlow - {% block titulo %}{% endblock %}</title>
</head>
<body>
    <h1>TaskFlow - {% block cabecalho %}{% endblock %}</h1>
    {% block conteudo %}{% endblock %}
</body>
</html>
