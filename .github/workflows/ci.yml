# Módulo 1 — CI básico: o portão de entrada de todo Pull Request.
# Gates: dependências instaladas com hash conferido, lint (ruff), formatação, testes.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Menor privilégio: o token só lê o repositório. Nenhum job escreve nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-lint:
    name: Build, lint e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar dependências (hash conferido)
        # --require-hashes: o mesmo controle de integridade do Dockerfile, aplicado no CI.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements.txt
          pip install ruff==0.8.4 pytest==8.3.4

      - name: Lint (ruff, inclui regras de segurança "S")
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Testes
        env:
          TASKFLOW_SECRET_KEY: ci-apenas-para-testes-nao-e-segredo-real
        run: pytest -q
